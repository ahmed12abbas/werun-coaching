<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Tips · WE RUN</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8851F4">
<!-- "only light" forbids Android auto-dark from repainting the page: it greyed out the check-in code on Sami's phone (14 Sep). The dark theme is our own CSS. -->
<meta name="color-scheme" content="only light">
<!-- The theme chosen in the app or on /coach, before anything paints. This
     page has no toggle of its own, and without this it followed the phone. -->
<script src="js/early.js?v=af0c0ac7"></script>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts.css?v=dfd2907d">
<style>
/* Standalone for the same reason admin.html is: the athlete-facing CSS lives
   inline in index.html, and a coach's editor is not worth destabilising the
   page the club actually uses. The tokens are copied from it so the two look
   like one site. */
:root{
  --brand:#8851F4; --brand-ink:#fff; --brand-soft:#F2ECFE;
  --bg:#f7f7fa; --card:#fff; --fg:#14121c; --muted:#6a6580; --line:#e6e3ef;
  --ok:#0f9d58; --err:#dc2626; --radius:16px;
  --shadow:0 1px 2px rgba(20,18,28,.05),0 10px 30px rgba(20,18,28,.07);
  --display:"Teko",-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* The phone's choice, unless the one saved in the app or on /coach says
   otherwise -- the same two selectors site.css and console.css use. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#A47CF8; --brand-ink:#1b1030; --brand-soft:#241a3d;
  --bg:#101019; --card:#191826; --fg:#eeecf5; --muted:#9d99b5; --line:#2a2840;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --brand:#A47CF8; --brand-ink:#1b1030; --brand-soft:#241a3d;
  --bg:#101019; --card:#191826; --fg:#eeecf5; --muted:#9d99b5; --line:#2a2840;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 140px}
@media (min-width:1100px){.wrap{max-width:1280px}}
h1{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:.01em;
  text-transform:uppercase;margin:0 0 4px;line-height:1}
h2{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;margin:0;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-top:18px}
.card.live{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow)}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;padding:12px 13px;font:inherit;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:12px}
textarea{min-height:190px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--fg);font:inherit;font-weight:650;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.55;cursor:progress}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1 1 200px}
.err{color:var(--err);font-weight:600;margin-top:10px}
.ok{color:var(--ok);font-weight:650}
a{color:var(--brand)}

.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.head .grow{flex:1 1 180px;min-width:0}
.times{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.side+.side{margin-top:0}
.side .f+.f{margin-top:12px}
.ar textarea,.ar input{direction:rtl;text-align:right}

/* "Show this one to athletes" — a radio, because exactly one article is live. */
/* It is a <label>, so the uppercase/muted treatment every other label on
   the page gets has to be undone here — this one is a control, not a caption. */
.livepick{display:inline-flex;align-items:center;gap:8px;flex:none;font-size:13.5px;
  font-weight:650;padding:8px 13px;border:1px solid var(--line);border-radius:999px;cursor:pointer;
  text-transform:none;letter-spacing:0;color:var(--fg);margin-bottom:0}
.livepick input{width:auto;padding:0;margin:0;accent-color:var(--brand)}
.livepick.on{background:var(--brand-soft);border-color:var(--brand)}
.badge{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;flex:none}

.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.hint code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.prev{margin-top:12px;border:1px dashed var(--line);border-radius:13px;padding:14px 16px;background:var(--bg)}
.prev h3{font-family:var(--display);font-size:26px;font-weight:600;text-transform:uppercase;
  line-height:1.05;margin:0 0 8px}
.prev p{margin:0 0 9px;font-size:14.5px;line-height:1.6}
.prev ul{margin:0 0 9px;padding-inline-start:20px;font-size:14.5px}
.prev p:last-child,.prev ul:last-child{margin-bottom:0}
.sign-wrap{margin-top:14px;padding-top:11px;border-top:1px solid var(--line)}
.sign{display:inline-flex;align-items:center;gap:8px;color:var(--brand);
  text-decoration:none;font-size:13px;font-weight:650;line-height:1.35}
.sign:hover{text-decoration:underline}
.sign-ic{display:inline-flex;flex:none}
.sign svg{width:16px;height:16px;display:block}
/* The arrow points the way the language reads. */
[dir="rtl"] .sign svg{transform:scaleX(-1)}
.prev .cap{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
/* The photo button is a <label> round a hidden file input, so the caption
   treatment every other label gets is undone here, as .livepick does. */
.pick{text-transform:none;letter-spacing:0;margin-bottom:0}
.pick input{display:none}
.tip-photo{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px}

/* The save bar follows the coach down a long article rather than making her
   scroll back to the top to keep her work. */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:5;
  box-shadow:0 -6px 24px rgba(20,18,28,.08)}
.bar .in{max-width:960px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .msg{flex:1 1 140px;font-size:13.5px}
footer{margin-top:30px;font-size:13px;color:var(--muted)}

/* The header, as /coach has it: a way back, and the title. */
.t-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.t-head h1{margin:0}
.tool{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);color:var(--fg);text-decoration:none}
.tool svg{width:18px;height:18px}
/* The list: one line an article, tapped open for its editor. */
.t-top{display:flex;align-items:center;gap:12px;margin-top:18px}
.t-list{display:grid;gap:10px;margin-top:14px}
.t-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.t-row.live{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.t-row.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.t-what{flex:1 1 0;min-width:0;cursor:pointer}
.t-what b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-side{flex:none;display:flex;align-items:center;gap:10px}
.t-editor{margin-top:0;border-top:0;border-top-left-radius:0;border-top-right-radius:0}
.t-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.t-tabs button{padding:9px;border:0;border-radius:9px;background:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.t-tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
/* The In news switch. It is a <label>, so the caption look is undone. */
.tgl{display:inline-flex;align-items:center;gap:7px;margin:0;font-size:12.5px;font-weight:700;color:var(--muted);
  text-transform:none;letter-spacing:0;cursor:pointer}
.tgl input{appearance:none;-webkit-appearance:none;position:relative;width:40px;height:24px;padding:0;margin:0;
  border:0;border-radius:99px;background:var(--line);cursor:pointer;transition:background .2s}
.tgl input::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl input:checked{background:var(--brand)}
.tgl input:checked::before{transform:translateX(16px)}
.tgl input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:560px){
  .t-row{flex-wrap:wrap}
  .t-side{flex:1 1 100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){.tgl input,.tgl input::before{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="t-head">
    <a class="tool back" href="/admin" title="Back to the console" aria-label="Back to the console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Coach Tips</h1>
  </div>
  <p class="muted small" style="margin:0">
    What athletes read when they tap the logo beside the session. The one marked <b>Live</b> is the one they see;
    any marked <b>News</b> also show on the News tab.
  </p>
  <div id="app"></div>
  <footer>WE RUN Coaching · <a href="/">back to the builder</a></footer>
</div>

<script src="js/sfx.js?v=7b9bd8c9"></script>
<script src="js/tipfmt.js?v=6b754eff"></script>
<script src="js/shrink.js?v=6a2c4ccc"></script>
<script src="js/tips-page.js?v=ecc91900"></script>
</body>
</html>
