name: Set up the Cloudflare bindings

# Manual only, and deliberately so: this writes *account* configuration — a KV
# namespace, the D1 database and the secrets the Worker checks against — not
# site content. It is the scripted version of the dashboard steps in the
# README, for when the Cloudflare login that owns the project is not to hand.
#
# It is safe to run more than once. The namespace and the database are looked
# up by name before they are created, and the PATCH names only the keys it
# sets, so re-running re-points the same bindings rather than stacking more.
#
# Before the first run, set the passwords as repo secrets — from a file, not a
# console paste, which has truncated before:
#
#   Get-Content pw.txt | gh secret set TIPS_PASSWORD
#
# ADMIN_PASSWORD is optional and unlocks /admin the same way. QR_SECRET signs
# the check-in codes (any long random string; `openssl rand -hex 32`).
# RESEND_API_KEY is optional and switches on the confirmation and
# password-reset mail; set the repo *variable* EMAIL_FROM alongside it to say
# who that mail comes from. None of the secret values is ever printed: all are
# masked in the log, and the request body is written to a file rather than an
# echoed command line.
#
# The token needs Pages:Edit, Workers KV Storage:Edit and D1:Edit.

on:
  workflow_dispatch:
    inputs:
      namespace_id:
        description: "KV namespace id — skips the KV lookup, for a Pages-only token"
        required: false
        default: ""
      database_id:
        description: "D1 database id — skips the D1 lookup, for a Pages-only token"
        required: false
        default: ""
      unbind_kv:
        description: "Remove the STATS binding instead of adding it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # to kick the deploy that makes the new bindings live

jobs:
  bind:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TIPS_PASSWORD: ${{ secrets.TIPS_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      QR_SECRET: ${{ secrets.QR_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      PROJECT: weruncoaching
      KV_TITLE: werun-stats
      D1_NAME: werun-db
      NS_INPUT: ${{ inputs.namespace_id }}
      D1_INPUT: ${{ inputs.database_id }}
      UNBIND: ${{ inputs.unbind_kv }}
      SITE: https://weruncoaching.pages.dev

    steps:
      # Masking before anything else runs: a secret that reaches the log once
      # is burned, and this workflow exists because that already happened to a
      # token in this repo.
      - name: Mask the secrets
        run: |
          set -euo pipefail
          [ -n "${TIPS_PASSWORD}" ] && echo "::add-mask::${TIPS_PASSWORD}" || true
          [ -n "${ADMIN_PASSWORD}" ] && echo "::add-mask::${ADMIN_PASSWORD}" || true
          [ -n "${QR_SECRET}" ] && echo "::add-mask::${QR_SECRET}" || true
          [ -n "${RESEND_API_KEY}" ] && echo "::add-mask::${RESEND_API_KEY}" || true
          [ -n "${STRIPE_SECRET_KEY}" ] && echo "::add-mask::${STRIPE_SECRET_KEY}" || true
          [ -n "${STRIPE_WEBHOOK_SECRET}" ] && echo "::add-mask::${STRIPE_WEBHOOK_SECRET}" || true
          echo "done"

      - name: Check what we have to work with
        run: |
          set -euo pipefail
          missing=""
          [ -z "${TOKEN}" ]   && missing="$missing CLOUDFLARE_API_TOKEN" || true
          [ -z "${ACCOUNT}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID" || true
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            exit 1
          fi
          if [ -z "${TIPS_PASSWORD}" ] && [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::Set TIPS_PASSWORD (or ADMIN_PASSWORD) as a repo secret first."\
                 "The Worker locks both /tips and /admin until one of them exists."
            exit 1
          fi
          echo "TIPS_PASSWORD set:  $([ -n "${TIPS_PASSWORD}" ] && echo yes || echo no)"
          echo "ADMIN_PASSWORD set: $([ -n "${ADMIN_PASSWORD}" ] && echo yes || echo no)"
          echo "QR_SECRET set:      $([ -n "${QR_SECRET}" ] && echo yes || echo no)"
          echo "RESEND_API_KEY set: $([ -n "${RESEND_API_KEY}" ] && echo yes || echo no)"
          echo "STRIPE keys set:    $([ -n "${STRIPE_SECRET_KEY}" ] && echo yes || echo no) / webhook $([ -n "${STRIPE_WEBHOOK_SECRET}" ] && echo yes || echo no)"
          if [ -n "${STRIPE_SECRET_KEY}" ] && [ -z "${STRIPE_WEBHOOK_SECRET}" ]; then
            echo "::warning::STRIPE_SECRET_KEY without STRIPE_WEBHOOK_SECRET — every order would sit at pending."
          fi
          echo "EMAIL_FROM:         ${EMAIL_FROM:-(unset — a Resend test sender is used)}"
          if [ -z "${QR_SECRET}" ]; then
            echo "::warning::QR_SECRET is not set — check-in codes stay off until it is."
          fi

      # Both halves are checked before either is written, so a token that can
      # deploy but not reach KV says so plainly instead of failing midway.
      - name: Check what the token can reach
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"

          pages=$(curl -sS -o /tmp/p.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$base/pages/projects/$PROJECT")
          kv=$(curl -sS -o /tmp/k.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$base/storage/kv/namespaces?per_page=1")
          d1=$(curl -sS -o /tmp/d.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$base/d1/database?per_page=1")

          echo "Pages project read: HTTP $pages"
          if curl -sS -o /tmp/all.json -H "Authorization: Bearer $TOKEN" \
               "$base/pages/projects" >/dev/null 2>&1; then
            echo "Pages projects in this account:"
            jq -r '.result[]? | "  - " + .name' /tmp/all.json || true
          fi
          echo "KV namespace list:  HTTP $kv"
          echo "D1 database list:   HTTP $d1"

          ok=yes
          if [ "$pages" != "200" ]; then
            ok=no
            echo "::error::The token cannot read the '$PROJECT' Pages project (HTTP $pages)."\
                 "A 404 means CLOUDFLARE_ACCOUNT_ID points at the wrong account."
          fi
          if [ -n "${NS_INPUT}" ] || [ "${UNBIND}" = "true" ]; then
            echo "Not looking anything up on this run, so the KV API is not needed."
          elif [ "$kv" != "200" ]; then
            ok=no
            echo "::error::The token cannot reach Workers KV (HTTP $kv). Cloudflare answers"\
                 "401 code 10000 when a token has no grant for a resource class at all, and"\
                 "403 when it has one that is too narrow. Either way the token needs"\
                 "reminting with 'Workers KV Storage: Edit' added alongside 'Pages: Edit',"\
                 "signed in as the account that owns the project. See the README."
          fi
          if [ -n "${D1_INPUT}" ] || [ "${UNBIND}" = "true" ]; then
            echo "Not looking the database up on this run, so the D1 API is not needed."
          elif [ "$d1" != "200" ]; then
            ok=no
            echo "::error::The token cannot reach D1 (HTTP $d1). Remint it with 'D1: Edit'"\
                 "alongside the KV and Pages grants, or pass database_id to skip the lookup."
          fi
          [ "$ok" = "yes" ] || exit 1
          echo "Everything reachable — going ahead."
      # The token needs Workers KV Storage:Edit for this and Pages:Edit for the
      # step after. If it was minted Pages-only, this is where that shows up.
      - name: Find or create the KV namespace
        id: kv
        run: |
          set -euo pipefail
          if [ "${UNBIND}" = "true" ]; then
            echo "Unbinding — no namespace needed."
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${NS_INPUT}" ]; then
            echo "Using the namespace id given on the run: ${NS_INPUT}"
            echo "id=${NS_INPUT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/storage/kv/namespaces"

          code=$(curl -sS -o /tmp/list.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$api?per_page=100")
          if [ "$code" != "200" ]; then
            echo "::error::Listing KV namespaces answered $code — see the probe above."
            jq -r '.errors // .' /tmp/list.json || cat /tmp/list.json
            exit 1
          fi

          id=$(jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id' /tmp/list.json | head -1)

          if [ -n "$id" ]; then
            echo "Reusing the existing '$KV_TITLE' namespace."
          else
            echo "No '$KV_TITLE' namespace yet — creating it."
            code=$(curl -sS -o /tmp/new.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -nc --arg t "$KV_TITLE" '{title:$t}')" "$api")
            if [ "$code" != "200" ]; then
              echo "::error::Creating the KV namespace answered $code."
              jq -r '.errors // .' /tmp/new.json || cat /tmp/new.json
              exit 1
            fi
            id=$(jq -r '.result.id' /tmp/new.json)
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Could not determine the namespace id."
            exit 1
          fi
          echo "namespace id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Same shape for the database: by name, create if missing, hand on the id.
      # The tables themselves come from migrations/, applied by every deploy.
      - name: Find or create the D1 database
        id: d1
        run: |
          set -euo pipefail
          if [ "${UNBIND}" = "true" ]; then
            echo "Unbinding — the database is left alone."
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${D1_INPUT}" ]; then
            echo "Using the database id given on the run: ${D1_INPUT}"
            echo "id=${D1_INPUT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/d1/database"

          code=$(curl -sS -o /tmp/dbs.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$api?name=$D1_NAME")
          if [ "$code" != "200" ]; then
            echo "::error::Listing D1 databases answered $code — see the probe above."
            jq -r '.errors // .' /tmp/dbs.json || cat /tmp/dbs.json
            exit 1
          fi

          id=$(jq -r --arg n "$D1_NAME" '.result[] | select(.name == $n) | .uuid' /tmp/dbs.json | head -1)

          if [ -n "$id" ]; then
            echo "Reusing the existing '$D1_NAME' database."
          else
            echo "No '$D1_NAME' database yet — creating it."
            code=$(curl -sS -o /tmp/newdb.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$D1_NAME" '{name:$n}')" "$api")
            if [ "$code" != "200" ]; then
              echo "::error::Creating the D1 database answered $code."
              jq -r '.errors // .' /tmp/newdb.json || cat /tmp/newdb.json
              exit 1
            fi
            id=$(jq -r '.result.uuid' /tmp/newdb.json)
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Could not determine the database id."
            exit 1
          fi
          echo "database id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # PATCH names only the keys it sets, so anything already configured on the
      # project is left alone — including secrets, whose values the API will not
      # hand back and so could not be re-sent even if we wanted to.
      - name: Bind them to the Pages project
        env:
          NS: ${{ steps.kv.outputs.id }}
          DB: ${{ steps.d1.outputs.id }}
        run: |
          set -euo pipefail
          if [ "${UNBIND}" = "true" ]; then
            # null deletes the key rather than setting it empty.
            echo '{"deployment_configs":{"production":{"kv_namespaces":{"STATS":null}}}}' > /tmp/patch.json
            echo "Removing the STATS binding."
          else
          jq -nc \
            --arg ns "${NS}" \
            --arg db "${DB}" \
            --arg tips "${TIPS_PASSWORD}" \
            --arg admin "${ADMIN_PASSWORD}" \
            --arg qr "${QR_SECRET}" \
            --arg resend "${RESEND_API_KEY}" \
            --arg mailfrom "${EMAIL_FROM}" \
            --arg sk "${STRIPE_SECRET_KEY}" \
            --arg whsec "${STRIPE_WEBHOOK_SECRET}" '
            {
              deployment_configs: {
                production: (
                  { kv_namespaces: { STATS: { namespace_id: $ns } },
                    d1_databases: { DB: { id: $db } },
                    env_vars: {} }
                  | if $tips  != "" then .env_vars.TIPS_PASSWORD  = { type: "secret_text", value: $tips  } else . end
                  | if $admin != "" then .env_vars.ADMIN_PASSWORD = { type: "secret_text", value: $admin } else . end
                  | if $qr     != "" then .env_vars.QR_SECRET      = { type: "secret_text", value: $qr     } else . end
                  | if $resend != "" then .env_vars.RESEND_API_KEY = { type: "secret_text", value: $resend } else . end
                  | if $mailfrom != "" then .env_vars.EMAIL_FROM  = { type: "plain_text",  value: $mailfrom } else . end
                  | if $sk     != "" then .env_vars.STRIPE_SECRET_KEY     = { type: "secret_text", value: $sk     } else . end
                  | if $whsec  != "" then .env_vars.STRIPE_WEBHOOK_SECRET = { type: "secret_text", value: $whsec  } else . end
                )
              }
            }' > /tmp/patch.json
          fi

          code=$(curl -sS -o /tmp/patched.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/patch.json \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$PROJECT")
          rm -f /tmp/patch.json

          if [ "$code" != "200" ]; then
            echo "::error::Patching the project answered $code. A 403 here means the"\
                 "token lacks 'Pages: Edit'; a 404 means the project is not in the"\
                 "account CLOUDFLARE_ACCOUNT_ID names."
            jq -r '.errors // .' /tmp/patched.json || cat /tmp/patched.json
            exit 1
          fi

          # Names only. The values are secret_text and come back without them.
          echo "Bindings now on production:"
          jq -r '
            def names: keys | if length == 0 then "none" else join(", ") end;
            .result.deployment_configs.production
            | "  kv namespaces: " + ((.kv_namespaces // {}) | names),
              "  d1 databases:  " + ((.d1_databases // {}) | names),
              "  env vars:      " + ((.env_vars // {}) | names)' /tmp/patched.json

      # Pages hands bindings to the Worker at deploy time, so the running one
      # cannot see them until the next deployment.
      - name: Redeploy so the Worker picks them up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run "Deploy to Cloudflare Pages" --ref main --repo "$REPO"
          echo "Deploy dispatched."

      - name: Wait for the site to report itself plugged in
        run: |
          set -euo pipefail
          echo "Polling $SITE/api/health until it sees the store and the database."
          for i in $(seq 1 30); do
            sleep 10
            body=$(curl -sS "$SITE/api/health" || echo '{}')
            echo "  attempt $i: $body"
            if [ "$(echo "$body" | jq -r '.store and .db and (.tables > 0)')" = "true" ]; then
              echo "Configured — KV bound, D1 bound and migrated."
              exit 0
            fi
          done
          echo "::warning::Still not reporting both bindings after five minutes. They were"\
               "written; the deploy may just be slow. Open $SITE/api/health by hand."
