name: Deploy to Cloudflare Pages

# Cloudflare's own Git integration needs its GitHub App installed on the
# account, which is a dashboard-only OAuth step. This does the same job from
# the other side: every push to main uploads the site to the `weruncoaching`
# Pages project as a Direct Upload, so the URL stays exactly as it is.
#
# The project lives in the account named by CLOUDFLARE_ACCOUNT_ID. It is
# deliberately NOT called `werun` — that name belongs to a project in a
# different Cloudflare account, and *.pages.dev names are globally unique.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # A stale ?v= stamp is invisible until a returning visitor runs old
      # javascript against new html, so the stamps are checked here rather than
      # trusted. The script is idempotent: if it changes anything, index.html
      # went out without being stamped.
      - name: Check the cache-busting stamps are current
        run: |
          node tools/version-assets.js
          # admin.html and tips.html load js/tipfmt.js too, so all three are checked.
          pages="index.html admin.html tips.html"
          if ! git diff --quiet -- $pages; then
            echo "::error::Script tags are stamped with stale hashes."\
                 "Run 'node tools/version-assets.js' and commit the result."
            git --no-pager diff -- $pages
            exit 1
          fi
          echo "Stamps are current."

      - name: Check the Cloudflare token is set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create a token with the"\
                 "'Edit Cloudflare Workers' template at"\
                 "https://dash.cloudflare.com/profile/api-tokens then run:"\
                 "gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      # Only the site itself goes up — never the repo root, which carries the
      # connect worker, the docs and the readme. _worker.js/ is a reserved
      # name: Pages runs it in front of the static files instead of serving it,
      # which is what keeps the API and the password checks off the wire.
      # Wrangler bundles the directory into one script on upload.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html admin.html tips.html _site/
          cp -r js assets _worker.js _site/
          find _site -type f | sort

      # The platform's tables. The database is created by the bindings
      # workflow, not here — so until that has been run once, this step says
      # so and steps aside rather than failing every deploy of the plain site.
      - name: Is the D1 database there yet?
        id: d1
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/d1.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/d1/database?name=werun-db")
          n=$(jq -r '.result | length' /tmp/d1.json 2>/dev/null || echo 0)
          if [ "$code" = "200" ] && [ "$n" != "0" ]; then
            echo "werun-db exists — migrations will run."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No 'werun-db' D1 database visible (HTTP $code). Skipping migrations;"\
                 "run the 'Set up the Cloudflare bindings' workflow to create and bind it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.d1.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply werun-db --remote

      # The `weruncoaching` project lives in whichever account CLOUDFLARE_ACCOUNT_ID
      # points at. If it is not there yet, create it as a Direct Upload project
      # so the deploy step below has something to upload into.
      - name: Ensure the Pages project exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects"
          code=$(curl -sS -o /tmp/look.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$api/weruncoaching")
          if [ "$code" = "200" ]; then
            echo "Project 'weruncoaching' already exists in this account."
            jq -r '.result.subdomain' /tmp/look.json
            exit 0
          fi
          echo "Lookup returned $code — creating the project."
          jq -r '.errors' /tmp/look.json || true
          curl -sS -X POST -o /tmp/new.json -w 'create HTTP %{http_code}\n' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"weruncoaching","production_branch":"main"}' "$api"
          if [ "$(jq -r '.success' /tmp/new.json)" != "true" ]; then
            echo "::error::Could not create the Pages project:"
            jq -r '.errors' /tmp/new.json
            exit 1
          fi
          echo "Created. Subdomain: $(jq -r '.result.subdomain' /tmp/new.json)"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name weruncoaching --branch main --commit-dirty=true
