<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Share stats · WE RUN</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8851F4">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* This page is deliberately standalone: the athlete-facing CSS all lives
   inline in index.html, and a coach's dashboard is not worth destabilising
   the page the club actually uses. The tokens below are copied from it so
   the two look like one site. */
:root{
  --brand:#8851F4; --brand-ink:#fff; --brand-soft:#F2ECFE;
  --bg:#f7f7fa; --card:#fff; --fg:#14121c; --muted:#6a6580; --line:#e6e3ef;
  --err:#dc2626; --radius:16px;
  --shadow:0 1px 2px rgba(20,18,28,.05),0 10px 30px rgba(20,18,28,.07);
  --display:"Teko",-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --brand:#A47CF8; --brand-ink:#1b1030; --brand-soft:#241a3d;
  --bg:#101019; --card:#191826; --fg:#eeecf5; --muted:#9d99b5; --line:#2a2840;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:.01em;
  text-transform:uppercase;margin:0 0 4px;line-height:1}
h2{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;margin:0 0 10px;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-top:18px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px 13px;font:inherit;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:12px}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--fg);font:inherit;font-weight:650;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.55;cursor:progress}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1 1 200px}
.err{color:var(--err);font-weight:600;margin-top:10px}
.scroll{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.wk{font-weight:700}
.wk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.zero{color:var(--muted)}
.tot{font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--brand);min-width:3px}
.barcell{width:34%}
.barwrap{background:var(--line);border-radius:99px;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--brand-soft);border-radius:13px;padding:14px 16px}
.tile .n{font-family:var(--display);font-size:38px;line-height:1;font-weight:600}
.tile .l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-top:4px}
/* ---- the read-only look at Coach Tips ---- */
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
a.btn{text-decoration:none}
.badge{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;flex:none}
.tiphead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tiphead h2{flex:1 1 auto}
.tipart{border:1px solid var(--line);border-radius:13px;margin-top:10px;overflow:hidden}
.tipart.live{border-color:var(--brand)}
.tipart>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.tipart>summary::-webkit-details-marker{display:none}
.tipart>summary:hover{background:var(--bg)}
.tiptitle{font-weight:650;flex:1 1 200px;min-width:0}
.tipwhen{flex:0 1 auto;white-space:nowrap}
@media (max-width:560px){.tipwhen{white-space:normal;flex-basis:100%}}
.tipbody{padding:12px 14px 14px;border-top:1px solid var(--line)}
/* The two languages read as one article, split by a rule rather than a gap. */
.tipside+.tipside{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.tipside.ar{direction:rtl;text-align:right}
.tiplang{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.tipside h3{font-family:var(--display);font-size:24px;font-weight:600;text-transform:uppercase;
  line-height:1.05;margin:0 0 8px}
.tipside p{margin:0 0 9px;font-size:14.5px;line-height:1.6}
.tipul{margin:0 0 9px;padding-inline-start:20px;font-size:14.5px}
.tipul li{margin-bottom:4px}
.tipside p:last-child,.tipul:last-child{margin-bottom:0}
.sign-wrap{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sign{display:inline-flex;align-items:center;gap:8px;color:var(--brand);
  text-decoration:none;font-size:12.5px;font-weight:650;line-height:1.35}
.sign:hover{text-decoration:underline}
.sign-ic{display:inline-flex;flex:none}
.sign svg{width:15px;height:15px;display:block}
/* The arrow points the way the language reads. */
[dir="rtl"] .sign svg{transform:scaleX(-1)}
/* ---- what athletes said ---- */
.rstars{flex:none;letter-spacing:2px;font-size:15px;line-height:1;white-space:nowrap}
.rstars span{color:var(--muted);opacity:.35}
.rstars span.on{color:var(--brand);opacity:1}
.spread{margin-top:14px;display:grid;gap:7px}
.sprow{display:grid;grid-template-columns:30px 1fr 30px;gap:10px;align-items:center;
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sprow .barwrap{height:8px}
.sprow .c{text-align:right}
.note{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:10px}
.notehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-weight:650}
.who.anon{font-weight:400;font-style:italic;color:var(--muted)}
.note p{margin:9px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap;
  overflow-wrap:anywhere}
.drop{margin-inline-start:auto;border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:15px;line-height:1;padding:4px 8px;border-radius:8px}
.drop:hover{color:var(--err);background:var(--bg)}
.drop:disabled{opacity:.5;cursor:progress}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Share stats</h1>
  <p class="muted small" style="margin:0">
    How many times athletes tapped <b>Share this session</b>, by ISO week —
    and what they said about the sessions.
  </p>
  <div id="app"></div>
  <footer>WE RUN Coaching · <a href="/">back to the builder</a></footer>
</div>

<script src="js/sfx.js?v=02d6c4d6"></script>
<script src="js/tipfmt.js?v=6b754eff"></script>
<script>
"use strict";

var app = document.getElementById("app");
var DAY_LABEL = {
  monday: "Mon", tuesday: "Tue", wednesday: "Wed", thursday: "Thu",
  friday: "Fri", saturday: "Sat", sunday: "Sun", other: "Other"
};

/* The password is only ever held here, in memory, for as long as this tab
   stays on the page. Nothing goes into storage, so a reload asks again --
   the right trade for a laptop a club shares. */
var password = null;

function el(tag, attrs) {
  var n = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null) continue;
    if (Array.isArray(c)) { for (var j = 0; j < c.length; j++) if (c[j] != null) n.append(c[j]); }
    else n.append(c);
  }
  return n;
}

function renderLogin(message) {
  app.textContent = "";
  var input = el("input", {
    type: "password",
    autocomplete: "current-password",
    placeholder: "Password",
    onkeydown: function (e) { if (e.key === "Enter") go(); }
  });
  var btn = el("button", { class: "btn primary", onclick: function () { go(); } }, "Show stats");

  function go() {
    if (!input.value) return;
    btn.disabled = true;
    load(input.value)["catch"](function (e) {
      renderLogin(e.message);
      var next = app.querySelector("input");
      if (next) next.focus();
    });
  }

  app.append(
    el("div", { class: "card" },
      el("div", { class: "row" },
        el("div", {}, el("label", {}, "Coach password"), input),
        el("div", { style: "flex:0 0 auto" }, btn)
      ),
      message ? el("p", { class: "err" }, message) : null
    )
  );
  input.focus();
}

function load(pw) {
  return fetch("/api/stats", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: pw })
  }).then(function (res) {
    if (res.status === 401) throw new Error("That password is not right.");
    if (res.status === 503) {
      throw new Error(
        "No password is set on the site yet, so the dashboard stays locked. " +
        "Set ADMIN_PASSWORD on the Pages project -- see the README."
      );
    }
    if (!res.ok) throw new Error("The server answered " + res.status + ". Try again in a moment.");
    return res.json();
  }).then(function (data) {
    password = pw;
    // The articles are a second, softer ask: if they cannot be read the
    // counts still render, with a line saying so.
    return loadTips(pw).then(function (tips) { renderStats(data, tips); });
  });
}

/* The club password opens the tips routes as well as this one, so the
   dashboard can show the articles without the coach's password being copied
   into a second page. A failure here is never fatal. */
function loadTips(pw) {
  return fetch("/api/tips-admin", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: pw })
  }).then(function (res) {
    return res.ok ? res.json() : null;
  })["catch"](function () { return null; });
}

/* Rendered with the same rules the athlete's cloud and the editor's preview
   use, loaded from js/tipfmt.js so all three agree by construction. */
function runs(text) {
  return tipRuns(text).map(function (r) {
    return r.bold ? el("b", {}, r.text) : document.createTextNode(r.text);
  });
}

/* No locale passed: dates follow whoever is reading the dashboard. */
function stamp(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return d.toLocaleString(undefined, {
    day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}

/** The byline athletes see under every article. */
function signatureNode(lang) {
  var ic = el("span", { class: "sign-ic" });
  ic.innerHTML = TIP_SIGN.icon;
  var a = el("a", {
    class: "sign",
    href: TIP_SIGN.url,
    target: "_blank",
    rel: "noopener noreferrer"
  }, ic, el("span", {}, tipSignName(lang)));
  return el("div", { class: "sign-wrap" }, a);
}

function tipSide(a, lang) {
  var side = (a && a[lang]) || {};
  if (!side.title && !side.body) return null;
  var box = el("div", { class: "tipside" + (lang === "ar" ? " ar" : "") });
  if (lang === "ar") box.setAttribute("dir", "rtl");
  box.append(el("div", { class: "tiplang" }, lang === "ar" ? "العربية" : "English"));
  if (side.title) box.append(el("h3", {}, side.title));
  tipBlocks(side.body).forEach(function (b) {
    if (b.kind === "ul") {
      var ul = el("ul", { class: "tipul" });
      b.items.forEach(function (t) { ul.append(el("li", {}, runs(t))); });
      box.append(ul);
    } else {
      box.append(el("p", {}, runs(b.text)));
    }
  });
  box.append(signatureNode(lang));
  return box;
}

function tipArticle(a, isLive) {
  var title = (a.en && a.en.title) || (a.ar && a.ar.title) || "Untitled";
  // Articles saved before `created` existed fall back to their last edit.
  var posted = stamp(a.created || a.updated);
  // Only show the edit when it is a different moment from the posting.
  var edited = a.created && a.updated && a.updated !== a.created ? stamp(a.updated) : null;
  var when = posted ? "Posted " + posted + (edited ? " \u00b7 Updated " + edited : "") : null;
  // This page’s el() sets every attribute it is given, so a false `open`
  // would land as open="false" — which is still a present attribute, and
  // still opens the details. Set it only when it is wanted.
  var d = el("details", { class: "tipart" + (isLive ? " live" : "") },
    el("summary", {},
      el("span", { class: "tiptitle" }, title),
      isLive ? el("span", { class: "badge" }, "Live")
             : el("span", { class: "muted small" }, "draft"),
      when ? el("span", { class: "muted small tipwhen" }, when) : null));
  if (isLive) d.setAttribute("open", "");

  var body = el("div", { class: "tipbody" });
  var sides = [tipSide(a, "en"), tipSide(a, "ar")].filter(Boolean);
  if (!sides.length) sides = [el("p", { class: "muted small" }, "Nothing written yet.")];
  sides.forEach(function (n) { body.append(n); });
  d.append(body);
  return d;
}

function tipsCard(tips) {
  var card = el("div", { class: "card" },
    el("div", { class: "tiphead" },
      el("h2", {}, "Coach Tips"),
      el("a", { class: "btn sm", href: "/tips" }, "Open the editor")));

  var note = function (t) {
    card.append(el("p", { class: "muted small", style: "margin:10px 0 0" }, t));
    return card;
  };

  if (!tips) return note("Could not read the articles with this password.");
  if (tips.warning === "no-store") return note("No KV namespace is bound, so there is nowhere to keep articles.");

  var arts = tips.articles || [];
  if (!arts.length) {
    return note("No articles yet. Nothing appears beside the session until one is " +
                "written and marked live.");
  }

  var hasLive = arts.some(function (a) { return a.id === tips.liveId; });
  card.append(el("p", { class: "muted small", style: "margin:10px 0 2px" },
    hasLive
      ? "Athletes see the one marked live. " + arts.length + " saved in total."
      : "Nothing is marked live, so the button is hidden on the session page."));

  arts.forEach(function (a) { card.append(tipArticle(a, a.id === tips.liveId)); });
  return card;
}

/* Five glyphs, the first n of them lit. Text stars rather than an icon: the
   dashboard is read at a glance and a row of them is instantly a rating. */
function starRow(n) {
  var wrap = el("span", { class: "rstars", title: n + " out of 5" });
  for (var i = 1; i <= 5; i++) wrap.append(el("span", { class: i <= n ? "on" : "" }, "\u2605"));
  return wrap;
}

/* An athlete may have written Arabic while the page was in English or the
   other way round, so the direction is read off the words themselves rather
   than assumed from the language the form was in. */
function said(text) {
  var p = el("p", { dir: "auto" });
  p.textContent = text;
  return p;
}

function feedbackCard(first) {
  var card = el("div", { class: "card" });

  function drop(item, btn) {
    if (!window.confirm("Delete this note? It cannot be brought back.")) return;
    btn.disabled = true;
    fetch("/api/feedback-admin", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: password, remove: item.id })
    }).then(function (res) {
      if (!res.ok) throw new Error("The server answered " + res.status + ".");
      return res.json();
    }).then(paint)["catch"](function (e) {
      btn.disabled = false;
      card.append(el("p", { class: "err" }, e.message));
    });
  }

  function note(item) {
    var box = el("div", { class: "note" });
    var when = stamp(item.at);
    var drop_ = el("button", {
      class: "drop", title: "Delete", "aria-label": "Delete this note",
      onclick: function () { drop(item, drop_); }
    }, "\u2715");

    box.append(el("div", { class: "notehead" },
      starRow(item.rating),
      el("span", { class: "who" + (item.name ? "" : " anon"), dir: "auto" },
        item.name || "Anonymous"),
      el("span", { class: "muted small" },
        [item.session, when].filter(Boolean).join(" \u00b7 ")),
      drop_));

    if (item.comment) box.append(said(item.comment));
    return box;
  }

  function paint(data) {
    card.textContent = "";
    card.append(el("div", { class: "tiphead" }, el("h2", {}, "What athletes said")));

    if (!data || !data.count) {
      card.append(el("p", { class: "muted small", style: "margin:10px 0 0" },
        "No ratings yet. The box sits at the foot of every session link, " +
        "beside Share this session."));
      return;
    }

    var items = data.items || [];
    var withWords = items.filter(function (i) { return i && i.comment; }).length;
    card.append(el("div", { class: "tiles" },
      el("div", { class: "tile" },
        el("div", { class: "n" }, data.average.toFixed(1)),
        el("div", { class: "l" }, "Average")),
      el("div", { class: "tile" },
        el("div", { class: "n" }, String(data.count)),
        el("div", { class: "l" }, data.count === 1 ? "Rating" : "Ratings")),
      el("div", { class: "tile" },
        el("div", { class: "n" }, String(withWords)),
        el("div", { class: "l" }, "With a comment"))));

    // Five bars beat one average: two people at one star and two at five are
    // not the same club as four people at three, and the mean cannot say so.
    var peak = Math.max.apply(null, (data.spread || []).concat(1));
    var bars = el("div", { class: "spread" });
    for (var r = 5; r >= 1; r--) {
      var n = (data.spread || [])[r - 1] || 0;
      bars.append(el("div", { class: "sprow" },
        el("span", {}, r + "\u2605"),
        el("div", { class: "barwrap" },
          el("div", { class: "bar", style: "width:" + Math.round((n / peak) * 100) + "%" })),
        el("span", { class: "c" }, String(n))));
    }
    card.append(bars);

    items.forEach(function (i) { if (i) card.append(note(i)); });
  }

  paint(first);
  return card;
}

function renderStats(data, tips) {
  app.textContent = "";
  var weeks = data.weeks || [];

  if (data.warning === "no-store") {
    app.append(el("div", { class: "card" },
      el("h2", {}, "Nothing is being recorded yet"),
      el("p", { class: "muted small", style: "margin:0" },
        "The password is right, but no KV namespace is bound to the site, so taps " +
        "are not being counted. Bind one called STATS -- see the README.")
    ));
    return;
  }

  if (!weeks.length) {
    app.append(el("div", { class: "card" },
      el("h2", {}, "No taps yet"),
      el("p", { class: "muted small", style: "margin:0" },
        "Counting is live. This fills in the first time an athlete taps " +
        "Share this session.")
    ));
    app.append(feedbackCard(data.feedback));
    app.append(tipsCard(tips));
    app.append(controls());
    return;
  }

  // Only show a day column once it has actually been used.
  var used = (data.days || []).concat("other").filter(function (d) {
    return weeks.some(function (w) { return (w.counts || {})[d]; });
  });
  var peak = Math.max.apply(null, weeks.map(function (w) { return w.total; }).concat(1));

  var latest = weeks[0];
  app.append(
    el("div", { class: "card" },
      el("h2", {}, "Latest week · " + latest.week),
      el("div", { class: "tiles" },
        used.map(function (d) {
          return el("div", { class: "tile" },
            el("div", { class: "n" }, String((latest.counts || {})[d] || 0)),
            el("div", { class: "l" }, DAY_LABEL[d] || d));
        }),
        el("div", { class: "tile" },
          el("div", { class: "n" }, String(latest.total)),
          el("div", { class: "l" }, "Total"))
      )
    )
  );

  var head = el("tr", {}, el("th", {}, "Week"),
    used.map(function (d) { return el("th", {}, DAY_LABEL[d] || d); }),
    el("th", {}, "Total"), el("th", { class: "barcell" }, ""));

  var body = el("tbody", {});
  weeks.forEach(function (w) {
    var counts = w.counts || {};
    body.append(el("tr", {},
      el("td", { class: "wk" }, w.week, el("small", {}, "from " + (w.start || "?"))),
      used.map(function (d) {
        var n = counts[d] || 0;
        return el("td", { class: n ? "" : "zero" }, String(n));
      }),
      el("td", { class: "tot" }, String(w.total)),
      el("td", { class: "barcell" },
        el("div", { class: "barwrap" },
          el("div", { class: "bar", style: "width:" + Math.round((w.total / peak) * 100) + "%" })))
    ));
  });

  app.append(
    el("div", { class: "card" },
      el("h2", {}, "Every week"),
      el("div", { class: "scroll" }, el("table", {}, el("thead", {}, head), body))
    )
  );
  app.append(feedbackCard(data.feedback));
  app.append(tipsCard(tips));
  app.append(controls());
}

function controls() {
  var refresh = el("button", { class: "btn", onclick: function () {
    refresh.disabled = true;
    load(password)["catch"](function (err) { renderLogin(err.message); });
  } }, "Refresh");

  return el("div", { class: "row", style: "margin-top:16px" },
    el("div", { style: "flex:0 0 auto" }, refresh),
    el("div", { style: "flex:0 0 auto" },
      el("button", { class: "btn", onclick: function () { password = null; renderLogin(null); } },
        "Lock")),
    el("div", { class: "muted small" },
      "Counts every tap, including repeat taps by the same athlete."));
}

renderLogin(null);
</script>
</body>
</html>
