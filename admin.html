<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach console · WE RUN</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8851F4">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* This page is deliberately standalone: the athlete-facing CSS all lives
   inline in index.html, and a coach's dashboard is not worth destabilising
   the page the club actually uses. The tokens below are copied from it so
   the two look like one site. */
:root{
  --brand:#8851F4; --brand-ink:#fff; --brand-soft:#F2ECFE;
  --bg:#f7f7fa; --card:#fff; --fg:#14121c; --muted:#6a6580; --line:#e6e3ef;
  --err:#dc2626; --radius:16px;
  --shadow:0 1px 2px rgba(20,18,28,.05),0 10px 30px rgba(20,18,28,.07);
  --display:"Teko",-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --brand:#A47CF8; --brand-ink:#1b1030; --brand-soft:#241a3d;
  --bg:#101019; --card:#191826; --fg:#eeecf5; --muted:#9d99b5; --line:#2a2840;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:.01em;
  text-transform:uppercase;margin:0 0 4px;line-height:1}
h2{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;margin:0 0 10px;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-top:18px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px 13px;font:inherit;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:12px}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--fg);font:inherit;font-weight:650;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.55;cursor:progress}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1 1 200px}
.err{color:var(--err);font-weight:600;margin-top:10px}
.scroll{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.wk{font-weight:700}
.wk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.zero{color:var(--muted)}
.tot{font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--brand);min-width:3px}
.barcell{width:34%}
.barwrap{background:var(--line);border-radius:99px;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--brand-soft);border-radius:13px;padding:14px 16px}
.tile .n{font-family:var(--display);font-size:38px;line-height:1;font-weight:600}
.tile .l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-top:4px}
/* ---- the read-only look at Coach Tips ---- */
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
a.btn{text-decoration:none}
.badge{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;flex:none}
.tiphead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tiphead h2{flex:1 1 auto}
.tipart{border:1px solid var(--line);border-radius:13px;margin-top:10px;overflow:hidden}
.tipart.live{border-color:var(--brand)}
.tipart>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.tipart>summary::-webkit-details-marker{display:none}
.tipart>summary:hover{background:var(--bg)}
.tiptitle{font-weight:650;flex:1 1 200px;min-width:0}
.tipwhen{flex:0 1 auto;white-space:nowrap}
@media (max-width:560px){.tipwhen{white-space:normal;flex-basis:100%}}
.tipbody{padding:12px 14px 14px;border-top:1px solid var(--line)}
/* The two languages read as one article, split by a rule rather than a gap. */
.tipside+.tipside{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.tipside.ar{direction:rtl;text-align:right}
.tiplang{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.tipside h3{font-family:var(--display);font-size:24px;font-weight:600;text-transform:uppercase;
  line-height:1.05;margin:0 0 8px}
.tipside p{margin:0 0 9px;font-size:14.5px;line-height:1.6}
.tipul{margin:0 0 9px;padding-inline-start:20px;font-size:14.5px}
.tipul li{margin-bottom:4px}
.tipside p:last-child,.tipul:last-child{margin-bottom:0}
.sign-wrap{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sign{display:inline-flex;align-items:center;gap:8px;color:var(--brand);
  text-decoration:none;font-size:12.5px;font-weight:650;line-height:1.35}
.sign:hover{text-decoration:underline}
.sign-ic{display:inline-flex;flex:none}
.sign svg{width:15px;height:15px;display:block}
/* The arrow points the way the language reads. */
[dir="rtl"] .sign svg{transform:scaleX(-1)}
/* ---- what athletes said ---- */
.rstars{flex:none;letter-spacing:2px;font-size:15px;line-height:1;white-space:nowrap}
.rstars span{color:var(--muted);opacity:.35}
.rstars span.on{color:var(--brand);opacity:1}
.spread{margin-top:14px;display:grid;gap:7px}
.sprow{display:grid;grid-template-columns:30px 1fr 30px;gap:10px;align-items:center;
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sprow .barwrap{height:8px}
.sprow .c{text-align:right}
.note{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:10px}
.notehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-weight:650}
.who.anon{font-weight:400;font-style:italic;color:var(--muted)}
.note p{margin:9px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap;
  overflow-wrap:anywhere}
.drop{margin-inline-start:auto;border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:15px;line-height:1;padding:4px 8px;border-radius:8px}
.drop:hover{color:var(--err);background:var(--bg)}
.drop:disabled{opacity:.5;cursor:progress}
/* ---- sessions and the code at the track ---- */
.pub{display:grid;gap:10px;margin-top:12px}
.pub .row>div{flex:1 1 130px}
.pub textarea{width:100%;min-height:58px;padding:11px 12px;font:inherit;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;resize:vertical}
.pub textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.decoded{font-size:13px;color:var(--muted)}
.decoded b{color:var(--fg)}
table.sess td,table.sess th{text-align:left;white-space:nowrap}
table.sess td.when small{display:block;color:var(--muted);font-weight:400}
table.sess td.acts .btn+.btn{margin-inline-start:6px}
table.sess tr.past td{color:var(--muted)}
.roster{margin-top:10px;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.roster h3{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;margin:0 0 8px}
.roster ol{margin:0;padding-inline-start:22px;font-size:14.5px}
.roster li{margin-bottom:5px;display:list-item}
.roster li.void{color:var(--muted);text-decoration:line-through}
.roster .drop{margin-inline-start:8px;text-decoration:none}

/* The code itself: as big as the screen allows, because it is read from a
   metre away by a phone held at arm's length in the dark. */
.qr-screen{position:fixed;inset:0;z-index:60;background:#fff;color:#111;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.qr-screen .code{width:min(78vh,92vw);aspect-ratio:1;display:block}
.qr-screen .code svg{width:100%;height:100%;display:block}
.qr-name{font-family:var(--display);font-size:30px;font-weight:600;text-transform:uppercase;
  line-height:1;text-align:center;margin:0}
.qr-sub{font-size:14px;color:#555;margin:0;text-align:center}
.qr-count{font-family:var(--display);font-size:40px;line-height:1;font-weight:600;margin:0}
.qr-bar{width:min(78vh,92vw);height:5px;border-radius:99px;background:#e6e3ef;overflow:hidden}
.qr-bar i{display:block;height:100%;background:#8851F4;transition:width .95s linear}
.qr-shut{color:#b91c1c;font-weight:700}
.qr-close{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:12px;
  border:1px solid #ddd;background:#fff;color:#333;border-radius:10px;padding:8px 13px;
  font:inherit;font-weight:650;cursor:pointer}
/* ---- the two ways in ---- */
.ways{display:grid;gap:14px}
.way{border:1px solid var(--line);border-radius:14px;padding:16px}
.way.first{border-color:var(--brand)}
.way h3{font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase;
  letter-spacing:.02em;margin:0 0 4px;line-height:1.1}
.way p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.way .row{align-items:flex-end}

/* ---- the feed editor ---- */
.posts{display:grid;gap:10px;margin-top:12px}
.post-row{border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.post-row.live{border-color:var(--brand)}
.post-row .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post-row .t{font-weight:650;flex:1 1 200px;min-width:0}
.post-row .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.two .ar textarea,.two .ar input{direction:rtl;text-align:right}
textarea{width:100%;min-height:90px;padding:11px 12px;font:inherit;font-size:14px;color:var(--fg);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus{outline:2px solid var(--brand);outline-offset:1px}

/* ---- settings ---- */
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:12px}
.setgrid .full{grid-column:1/-1}
.set-note{font-size:12px;color:var(--muted);margin-top:4px}
.danger{border-color:var(--err)}
.danger .sw span:first-of-type{color:var(--err)}
/* ---- the shop ---- */
.prod-row{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:10px}
.prod-row.live{border-color:var(--brand)}
.prod-row .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prod-row .t{font-weight:650;flex:1 1 180px;min-width:0}
.prod-row .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.money{font-variant-numeric:tabular-nums;font-weight:650}
table.ord td,table.ord th{text-align:left;white-space:nowrap}
table.ord td.money{text-align:right}
table.ord tr.handed td{color:var(--muted)}
table.ord tr.cancelled td{color:var(--muted);text-decoration:line-through}
.tiles .tile .l small{display:block;text-transform:none;letter-spacing:0;font-weight:400}
/* ---- the standing week ---- */
.wk-day{margin-top:14px}
.wk-day > h3{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;margin:0 0 6px;color:var(--muted)}
.wk-row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px}
.wk-row.off{opacity:.55}
.wk-row .at{flex:none;width:58px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-row .what{flex:1 1 auto;min-width:0}
.wk-row .what b{display:block;font-weight:650}
.wk-row .what span{font-size:13px;color:var(--muted)}
.wk-row .acts{display:flex;gap:6px;flex-wrap:wrap}
.wk-empty{color:var(--muted);font-size:14px;margin:0 0 8px}
.changes{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.change-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;
  padding:8px 0;border-bottom:1px solid var(--line)}
.change-row:last-child{border-bottom:0}
.change-row .when{font-weight:650;font-variant-numeric:tabular-nums}
/* ---- members ---- */
.switches{margin:12px 0 4px}
.sw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px;font-weight:650;
  text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer;margin:0}
.sw input{width:18px;height:18px;margin:0;accent-color:var(--brand)}
.sw .muted{font-weight:400}
table.members td,table.members th{text-align:left;white-space:nowrap}
table.members td.left{font-variant-numeric:normal}
table.members td.name{font-weight:650}
table.members td.name .badge{margin-inline-start:8px}
.badge.off{color:var(--err);background:transparent;border:1px solid var(--err)}
table.members tr.blocked td{color:var(--muted)}
table.members td.acts .btn+.btn{margin-inline-start:6px}
table.members td.conf{text-align:center;font-weight:700;color:var(--ok)}
footer{margin-top:30px;font-size:13px;color:var(--muted)}
a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Coach console</h1>
  <p class="muted small" style="margin:0">
    Everything the club runs on: this week's sessions and the code for the
    track, the news, who has joined, what they said, and the switches.
  </p>
  <div id="app"></div>
  <footer>WE RUN Coaching · <a href="/">back to the builder</a></footer>
</div>

<script src="js/i18n.js?v=89aaa8cf"></script>
<script src="js/model.js?v=3b1fab6f"></script>
<script src="js/qr.js?v=0d34ae98"></script>
<script src="js/sfx.js?v=96340c26"></script>
<script src="js/tipfmt.js?v=6b754eff"></script>
<script>
"use strict";

var app = document.getElementById("app");
var DAY_LABEL = {
  monday: "Mon", tuesday: "Tue", wednesday: "Wed", thursday: "Thu",
  friday: "Fri", saturday: "Sat", sunday: "Sun", other: "Other"
};

/* The password is only ever held here, in memory, for as long as this tab
   stays on the page. Nothing goes into storage, so a reload asks again --
   the right trade for a laptop a club shares. */
var password = null;

function el(tag, attrs) {
  var n = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null) continue;
    if (Array.isArray(c)) { for (var j = 0; j < c.length; j++) if (c[j] != null) n.append(c[j]); }
    else n.append(c);
  }
  return n;
}

/* Every console call goes through here, so the coach's login and the club
   password are one decision made in one place rather than in nine. When a
   coach is logged in nothing sends a password at all; the browser carries the
   cookie and the Worker recognises it. */
function api(route, payload) {
  var body = Object.assign({}, payload);
  if (password) body.password = password;
  return fetch(route, {
    method: "POST",
    headers: { "content-type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify(body)
  }).then(function (res) {
    return res.json()["catch"](function () { return {}; }).then(function (data) {
      if (res.ok) return data;
      if (data.error === "no-db") throw new Error("No database is bound to the site yet -- run the bindings workflow (see the README).");
      if (data.error === "has-checkins") throw new Error("Athletes have checked in to that one. Void their check-ins first if you really mean to remove it.");
      if (data.error === "bad-password") throw new Error("That password is not right.");
      if (data.error === "too-often") throw new Error("Too many tries. Wait a minute.");
      if (data.error === "qr-off") throw new Error("QR_SECRET is not set on the site, so codes cannot be signed. See the README.");
      if (data.error === "called-off") throw new Error("That one is called off for this date. Put it back first if it is running after all.");
      if (data.error === "not-configured") throw new Error("No club password is set on the site yet. Set ADMIN_PASSWORD on the Pages project -- see the README.");
      throw new Error("The server answered " + res.status + " (" + (data.error || "?") + ").");
    });
  });
}

function renderLogin(message) {
  app.textContent = "";

  /* The coach's own account. */
  var email = el("input", { type: "email", autocomplete: "username", placeholder: "you@example.com" });
  var pw = el("input", { type: "password", autocomplete: "current-password", placeholder: "Password",
    onkeydown: function (e) { if (e.key === "Enter") signIn(); } });
  var signBtn = el("button", { class: "btn primary", onclick: function () { signIn(); } }, "Sign in");
  var signErr = el("p", { class: "err", style: "display:none" });

  function signIn() {
    if (!email.value || !pw.value) return;
    signBtn.disabled = true;
    signErr.style.display = "none";
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email: email.value.trim(), password: pw.value })
    }).then(function (res) {
      return res.json()["catch"](function () { return {}; }).then(function (d) {
        if (!res.ok) throw new Error(d.error === "bad-login" ? "Wrong email or password."
          : d.error === "too-often" ? "Too many tries. Wait a minute."
          : "The server answered " + res.status + ".");
        if (!d.user || d.user.role !== "coach") {
          throw new Error("That account is a member, not a coach. Unlock with the club password below and use Members to make it one.");
        }
        return d;
      });
    }).then(function () {
      password = null; // the cookie is the credential from here on
      load(null)["catch"](function (e) { renderLogin(e.message); });
    })["catch"](function (e) {
      signBtn.disabled = false;
      signErr.textContent = e.message;
      signErr.style.display = "";
    });
  }

  /* The club password: the way in before there is a coach, and the way back
     in if the coach ever loses their account. */
  var input = el("input", {
    type: "password",
    autocomplete: "current-password",
    placeholder: "Club password",
    onkeydown: function (e) { if (e.key === "Enter") go(); }
  });
  var btn = el("button", { class: "btn", onclick: function () { go(); } }, "Unlock");

  function go() {
    if (!input.value) return;
    btn.disabled = true;
    load(input.value)["catch"](function (e) {
      renderLogin(e.message);
      var next = app.querySelector("input");
      if (next) next.focus();
    });
  }

  app.append(
    el("div", { class: "card" },
      el("div", { class: "ways" },
        el("div", { class: "way first" },
          el("h3", {}, "Sign in"),
          el("p", {}, "With your coach account — the same login as the app."),
          el("div", { class: "row" },
            el("div", {}, el("label", {}, "Email"), email),
            el("div", {}, el("label", {}, "Password"), pw),
            el("div", { style: "flex:0 0 auto" }, signBtn)),
          signErr),
        el("div", { class: "way" },
          el("h3", {}, "Or the club password"),
          el("p", {}, "How the first coach gets in, and the way back if an account is lost."),
          el("div", { class: "row" },
            el("div", {}, el("label", {}, "Club password"), input),
            el("div", { style: "flex:0 0 auto" }, btn)))),
      message ? el("p", { class: "err" }, message) : null)
  );
  email.focus();
}

function load(pw) {
  // Set first so api() carries it; cleared again if it turns out to be wrong.
  var had = password;
  password = pw;
  return api("/api/stats", {}).then(function (data) {
    // The articles are a second, softer ask: if they cannot be read the
    // counts still render, with a line saying so.
    return loadTips().then(function (tips) { renderStats(data, tips); });
  })["catch"](function (e) {
    password = had;
    throw e;
  });
}

/* The club password opens the tips routes as well as this one, so the
   dashboard can show the articles without the coach's password being copied
   into a second page. A failure here is never fatal. */
function loadTips() {
  return api("/api/tips-admin", {})["catch"](function () { return null; });
}

/* Rendered with the same rules the athlete's cloud and the editor's preview

/* The one list of coaches this page holds, and everyone drawing a picker out
   of it. Three cards would otherwise ask the server for the same short list
   and then disagree about it: promoting somebody in one has to fix the
   pickers in the other two, and a reload is not an answer at the track. */
var COACHES = {
  list: [],
  watchers: [],

  /* Fresh, from whichever answer carried them -- and the pickers that have
     since been thrown away go here, rather than growing for the length of a
     morning at the track. The standing week rebuilds its form on every save. */
  tell: function (rows) {
    if (rows) COACHES.list = rows;
    COACHES.watchers = COACHES.watchers.filter(function (w) { return w.sel.isConnected; });
    COACHES.watchers.forEach(function (w) { w.fill(); });
  },

  /** A <select> that keeps itself filled. `chosen` is the id to start on. */
  select: function (chosen) {
    var sel = el("select", {});
    // Held apart from the DOM because the picker is nearly always drawn
    // before the list arrives: with nothing to select, `chosen` would be lost
    // on the first paint and the slot's coach would read as "not said".
    var want = chosen || "";
    sel.addEventListener("change", function () { want = sel.value; });
    function fill() {
      sel.textContent = "";
      sel.append(el("option", { value: "" }, "Not said"));
      COACHES.list.forEach(function (c) { sel.append(el("option", { value: c.id }, c.name)); });
      sel.value = want;
      // An id belonging to somebody who no longer coaches has no option to
      // land on. Reading as "not said" -- and saving as that -- is honest.
      if (sel.value !== want) sel.value = "";
    }
    fill();
    COACHES.watchers.push({ sel: sel, fill: fill });
    return sel;
  },

  name: function (id) {
    for (var i = 0; i < COACHES.list.length; i++) if (COACHES.list[i].id === id) return COACHES.list[i].name;
    return "";
  }
};

  var name = el("input", { type: "text", maxlength: 80, placeholder: "Monday | WeRUN" });
  var date = el("input", { type: "date" });
  var time = el("input", { type: "time", value: "18:30" });

  function payloadOf(text) {

    if (m) return decodeURIComponent(m[1]);

    if (!name.value.trim()) name.value = w.name || "";

/* ---- the code on the screen ----
   A fresh code every thirty seconds, drawn by js/qr.js rather than fetched,
   so it keeps working when the track has no signal to speak of. The bar
   underneath is the slot running out; the number is who has scanned so far,
   which is the thing a coach actually watches. */
function qrScreen(session) {
  var img = el("div", { class: "code" });
  var count = el("p", { class: "qr-count" }, "0");
  var sub = el("p", { class: "qr-sub" }, "Athletes scan this with their camera.");
  var bar = el("i", {});
  var screen = el("div", { class: "qr-screen" },
    el("button", { class: "qr-close", onclick: close_ }, "Done"),
    el("h2", { class: "qr-name" }, session.name),
    img,
    el("div", { class: "qr-bar" }, bar),
    count, sub);

  var timer = null, tick = null, lock = null, dead = false;
  document.body.append(screen);
  // The coach is holding the phone up; letting it sleep mid-session is the
  // one failure that loses everybody's check-in.
  if (navigator.wakeLock && navigator.wakeLock.request) {
    navigator.wakeLock.request("screen").then(function (l) { lock = l; })["catch"](function () {});
  }

  function close_() {
    dead = true;
    clearTimeout(timer); clearInterval(tick);
    if (lock && lock.release) { try { lock.release(); } catch (e) {} }
    screen.remove();
  }
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape") { close_(); document.removeEventListener("keydown", esc); }
  });

  function refresh() {
    if (dead) return;
    api("/api/admin/qr", { id: session.id }).then(function (d) {
      if (dead) return;
      img.innerHTML = qrSvg(d.url, "M");
      count.textContent = String(d.came || 0);
      sub.textContent = d.open
        ? "Athletes scan this with their camera."
        : "Check-in is not open for this session right now.";
      sub.className = "qr-sub" + (d.open ? "" : " qr-shut");

      // The bar empties over the life of the slot, and the next code is
      // fetched as it runs out.
      var left = Math.max(1, d.seconds);
      var span = 30;
      bar.style.transition = "none";
      bar.style.width = Math.round((left / span) * 100) + "%";
      clearInterval(tick);
      tick = setInterval(function () {
        left -= 1;
        bar.style.transition = "width .95s linear";
        bar.style.width = Math.max(0, Math.round((left / span) * 100)) + "%";
      }, 1000);
      timer = setTimeout(refresh, d.seconds * 1000 + 200);
    })["catch"](function (e) {
      if (dead) return;
      img.textContent = "";
      img.append(el("p", { class: "err" }, e.message));
      timer = setTimeout(refresh, 5000);
    });
  }
  refresh();
}

      var name = /filename="([^"]+)"/.exec(res.headers.get("content-disposition") || "");

    if (editing) {
      nameEn.value = editing.name_en || ""; nameAr.value = editing.name_ar || "";
      descEn.value = editing.desc_en || ""; descAr.value = editing.desc_ar || "";
      price.value = (editing.price / 100).toFixed(2);
      options.value = editing.options || "";
      stock.value = editing.stock === null ? "" : String(editing.stock);
      if (editing.active) active.setAttribute("checked", "");
    }

    function save() {
      err.style.display = "none";
      var minor = Math.round(Number(price.value) * 100);
      if (!Number.isFinite(minor) || minor < 1) {
        err.textContent = "Give it a price."; err.style.display = ""; return;
      }
      post({ action: "save", product: {
        id: editing ? editing.id : null,
        name_en: nameEn.value, name_ar: nameAr.value,
        desc_en: descEn.value, desc_ar: descAr.value,
        price: minor, options: options.value,
        stock: stock.value === "" ? null : Number(stock.value),
        active: active.checked
      } }).then(function (d) { editing = null; form(); paint(d); })
        ["catch"](function (e) { err.textContent = e.message; err.style.display = ""; });
    }

    editor.append(el("div", { class: "two", style: "margin-top:12px" },
      el("div", {}, el("label", {}, "Name (English)"), nameEn,
        el("div", { style: "margin-top:10px" }, el("label", {}, "Description (English)"), descEn)),
      el("div", { class: "ar" }, el("label", {}, "Name (العربية)"), nameAr,
        el("div", { style: "margin-top:10px" }, el("label", {}, "Description (العربية)"), descAr))));

    editor.append(el("div", { class: "row", style: "margin-top:12px" },
      el("div", {}, el("label", {}, "Price"), price),
      el("div", {}, el("label", {}, "Sizes"), options,
        el("div", { class: "set-note" }, "Comma separated. Leave empty if there is only one of it.")),
      el("div", {}, el("label", {}, "How many"), stock,
        el("div", { class: "set-note" }, "Empty means unlimited."))));

    editor.append(el("div", { class: "row", style: "margin-top:10px" },
      el("div", { style: "flex:0 0 auto" },
        el("label", { class: "sw" }, active, el("span", {}, "On sale"))),
      el("div", { style: "flex:0 0 auto" },
        el("button", { class: "btn primary", onclick: save }, editing ? "Save it" : "Add it")),
      editing ? el("div", { style: "flex:0 0 auto" },
        el("button", { class: "btn", onclick: function () { editing = null; form(); } }, "New product")) : null));
    editor.append(err);
  }

  function post(payload) { return api("/api/admin/products", payload); }

  function paint(d) {
    list.textContent = "";
    if (d && d.stripe === false) {
      list.append(el("p", { class: "err" },
        "STRIPE_SECRET_KEY is not set, so nothing can actually be bought. See the README."));
    }
    var products = (d && d.products) || [];
    if (!products.length) {
      list.append(el("p", { class: "muted small", style: "margin:14px 0 0" },
        "Nothing in the shop yet. Athletes see the Shop tab only once something is on sale and the shop is open in Settings."));
      return;
    }
    products.forEach(function (p) {
      var row = el("div", { class: "prod-row" + (p.active ? " live" : "") },
        el("div", { class: "head" },
          el("span", { class: "t", dir: "auto" }, p.name_en || p.name_ar || "Untitled"),
          el("span", { class: "money" }, money(p.price)),
          p.active ? el("span", { class: "badge" }, "On sale") : el("span", { class: "muted small" }, "hidden"),
          el("span", { class: "muted small" },
            (p.options ? p.options + " \u00b7 " : "") +
            (p.stock === null ? "unlimited" : p.stock + " left"))));
      row.append(el("div", { class: "acts" },
        el("button", { class: "btn sm", onclick: function () { editing = p; form(); editor.scrollIntoView({ block: "nearest" }); } }, "Edit"),
        el("button", { class: "btn sm", onclick: function () {
          post({ action: "save", product: Object.assign({}, p, { active: !p.active }) })
            .then(paint)["catch"](function (e) { row.append(el("p", { class: "err" }, e.message)); });
        } }, p.active ? "Take off sale" : "Put on sale"),
        el("button", { class: "btn sm", onclick: function () {
          if (!window.confirm("Delete " + (p.name_en || p.name_ar) + "?")) return;
          post({ action: "delete", id: p.id }).then(paint)["catch"](function (e) {
            row.append(el("p", { class: "err" }, e.message));
          });
        } }, "Delete")));
      list.append(row);
    });
  }

  form();
  api("/api/admin/settings", {}).then(function (d) { currency = (d.settings || {}).currency || "usd"; })
    ["catch"](function () {})
    .then(function () { return post({ action: "list" }); })
    .then(paint)["catch"](function (e) {
      list.append(el("p", { class: "muted small", style: "margin:14px 0 0" }, e.message));
    });
  return card;
}

/* ---- who is owed one ----
   The list a coach reads at the track: paid, not yet handed over, oldest
   first once you scroll. Cancelling here marks the club's record and puts
   the stock back; the refund itself belongs in Stripe, where the money is. */
function ordersCard() {
  var card = el("div", { class: "card" },
    el("div", { class: "tiphead" }, el("h2", {}, "Orders")));
  var body = el("div", {});
  card.append(body);
  var currency = "usd";

  function money(minor, cur) {
    try {
      return new Intl.NumberFormat(undefined, { style: "currency", currency: (cur || currency).toUpperCase() })
        .format(minor / 100);
    } catch (e) { return (minor / 100).toFixed(2); }
  }
  function post(payload) { return api("/api/admin/orders", payload); }

  function paint(d) {
    body.textContent = "";
    if (d && d.stripe && d.webhook === false) {
      body.append(el("p", { class: "err" },
        "STRIPE_WEBHOOK_SECRET is not set, so Stripe cannot tell the site an order was paid " +
        "and every order will sit at pending. See the README."));
    }
    var orders = (d && d.orders) || [];
    if (d && (d.to_hand_over || (d.taken || []).length)) {
      var tiles = el("div", { class: "tiles" },
        el("div", { class: "tile" },
          el("div", { class: "n" }, String(d.to_hand_over || 0)),
          el("div", { class: "l" }, "To hand over")));
      (d.taken || []).forEach(function (t) {
        tiles.append(el("div", { class: "tile" },
          el("div", { class: "n" }, money(t.total, t.currency)),
          el("div", { class: "l" }, "Taken", el("small", {}, String(t.currency || "").toUpperCase()))));
      });
      body.append(tiles);
    }
    if (!orders.length) {
      body.append(el("p", { class: "muted small", style: "margin:14px 0 0" },
        "Nothing bought yet. Only orders that were actually paid for show here."));
      return;
    }
    var head = el("tr", {}, el("th", {}, "Who"), el("th", {}, "What"), el("th", {}, "Paid"),
      el("th", {}, "When"), el("th", {}, ""));
    var rows = el("tbody", {});
    orders.forEach(function (o) {
      var act = el("div", { class: "acts" });
      if (o.status === "paid") {
        var hand = el("button", { class: "btn sm primary", onclick: function () {
          hand.disabled = true;
          post({ action: "hand", id: o.id }).then(paint)["catch"](function (e) {
            hand.disabled = false; body.append(el("p", { class: "err" }, e.message));
          });
        } }, "Handed over");
        act.append(hand);
      } else if (o.status === "handed") {
        act.append(el("button", { class: "btn sm", onclick: function () {
          post({ action: "unhand", id: o.id }).then(paint)["catch"](function (e) {
            body.append(el("p", { class: "err" }, e.message));
          });
        } }, "Not yet"));
      }
      if (o.status !== "cancelled") {
        act.append(el("button", { class: "btn sm", onclick: function () {
          if (!window.confirm("Mark this order cancelled? Refund it in Stripe separately -- this only " +
            "changes the club's record and puts the stock back.")) return;
          post({ action: "cancel", id: o.id }).then(paint)["catch"](function (e) {
            body.append(el("p", { class: "err" }, e.message));
          });
        } }, "Cancel"));
      }
      rows.append(el("tr", { class: o.status },
        el("td", { dir: "auto" }, o.who, el("small", { style: "display:block;color:var(--muted)" }, o.email)),
        el("td", { dir: "auto" }, o.name + (o.variant ? " \u00b7 " + o.variant : "") + (o.qty > 1 ? " \u00d7 " + o.qty : "")),
        el("td", { class: "money" }, money(o.amount, o.currency)),
        el("td", {}, stamp(o.paid_at || o.created_at) || ""),
        el("td", {}, act)));
    });
    body.append(el("div", { class: "scroll" }, el("table", { class: "ord" }, el("thead", {}, head), rows)));
  }

  api("/api/admin/settings", {}).then(function (d) { currency = (d.settings || {}).currency || "usd"; })
    ["catch"](function () {})
    .then(function () { return post({ action: "list" }); })
    .then(paint)["catch"](function (e) {
      body.append(el("p", { class: "muted small", style: "margin:14px 0 0" }, e.message));
    });
  return card;
}

/* ---- the standing week ----
   Ten sessions that repeat is what the club actually runs on, so they live
   here as a pattern rather than as ten rows re-typed every Sunday. Moving or
   calling off one Tuesday is a change against that one date: editing the
   pattern would move every Tuesday after it as well, which is never what a
   coach means by "this week we are at the other gate". */
var WK_DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

/* The date a standing session next falls on -- today, when today is its day,
   because that is the morning the coach is at the track holding the phone up
   and the whole point of the button. */
function nextOccurrence(weekday) {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + ((weekday - d.getDay() + 7) % 7));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
    "-" + String(d.getDate()).padStart(2, "0");
}

function schedulePlanCard() {
  var card = el("div", { class: "card" },
    el("div", { class: "tiphead" }, el("h2", {}, "The standing week")));
  var editor = el("div", {});
  var list = el("div", {});
  var changes = el("div", { class: "changes" });
  card.append(editor, list, changes);

  var editing = null;
  function post(payload) { return api("/api/admin/schedule", payload); }

  function form() {
    editor.textContent = "";
    var day = el("select", {});
    WK_DAYS.forEach(function (name, i) { day.append(el("option", { value: String(i) }, name)); });
    var at = el("input", { type: "time" });
    var titleEn = el("input", { type: "text", maxlength: 80, placeholder: "Speed session" });
    var titleAr = el("input", { type: "text", maxlength: 80, placeholder: "تمرين سرعات" });
    var placeEn = el("input", { type: "text", maxlength: 100, placeholder: "Wadi Mahdia Road" });
    var placeAr = el("input", { type: "text", maxlength: 100, placeholder: "خط التفتيش - بعد الدوار" });
    var map = el("input", { type: "url", maxlength: 300, placeholder: "https://maps.app.goo.gl/…" });
    var points = el("input", { type: "number", min: "0", max: "1000", step: "1", value: "10" });
    var coach = COACHES.select(editing ? editing.coach_id : "");
    var active = el("input", { type: "checkbox" });
    active.setAttribute("checked", "");
    var err = el("p", { class: "err", style: "display:none" });

    if (editing) {
      day.value = String(editing.weekday);
      at.value = editing.at;
      titleEn.value = editing.title_en || ""; titleAr.value = editing.title_ar || "";
      placeEn.value = editing.place_en || ""; placeAr.value = editing.place_ar || "";
      map.value = editing.map_url || "";
      points.value = String(editing.points);
      if (!editing.active) active.removeAttribute("checked");
      active.checked = !!editing.active;
    }

    function save() {
      err.style.display = "none";
      if (!at.value) { err.textContent = "What time does it start?"; err.style.display = ""; return; }
      post({ action: "save", entry: {
        id: editing ? editing.id : null,
        weekday: Number(day.value), at: at.value,
        title_en: titleEn.value, title_ar: titleAr.value,
        place_en: placeEn.value, place_ar: placeAr.value,
        map_url: map.value, points: Number(points.value), active: active.checked,
        coach_id: coach.value
      } }).then(function (d) { editing = null; form(); paint(d); })
        ["catch"](function (e) { err.textContent = e.message; err.style.display = ""; });
    }

    editor.append(el("div", { class: "row", style: "margin-top:12px" },
      el("div", {}, el("label", {}, "Day"), day),
      el("div", {}, el("label", {}, "Starts"), at),
      el("div", {}, el("label", {}, "Points"), points),
      el("div", {}, el("label", {}, "Coach"), coach)));

    editor.append(el("div", { class: "two", style: "margin-top:12px" },
      el("div", {}, el("label", {}, "What (English)"), titleEn,
        el("div", { style: "margin-top:10px" }, el("label", {}, "Where (English)"), placeEn)),
      el("div", { class: "ar" }, el("label", {}, "What (العربية)"), titleAr,
        el("div", { style: "margin-top:10px" }, el("label", {}, "Where (العربية)"), placeAr))));

    editor.append(el("div", { style: "margin-top:12px" },
      el("label", {}, "Map link"), map,
      el("div", { class: "set-note" }, "Optional. Must start https:// — the place name becomes a link in the app.")));

    editor.append(err);
    editor.append(el("div", { class: "row", style: "margin-top:12px" },
      el("div", { style: "flex:0 0 auto" },
        el("label", { class: "sw" }, active, el("span", {}, "On the schedule"))),
      el("div", { style: "flex:0 0 auto" },
        el("button", { class: "btn primary", onclick: save }, editing ? "Save it" : "Add it")),
      editing ? el("div", { style: "flex:0 0 auto" },
        el("button", { class: "btn", onclick: function () { editing = null; form(); } }, "New session")) : null));
  }

  /* The next date a given weekday falls on, so "call one off" defaults to the
     one the coach is most likely to mean. */
  function nextDate(weekday) {
    var d = new Date();
    d.setDate(d.getDate() + ((weekday - d.getDay() + 7) % 7));
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function changeOne(entry, row) {
    var date = el("input", { type: "date", value: nextDate(entry.weekday) });
    var at = el("input", { type: "time", value: entry.at });
    var place = el("input", { type: "text", maxlength: 100, placeholder: entry.place_en || "somewhere else" });
    var note = el("input", { type: "text", maxlength: 200, placeholder: "Meeting at the far gate" });
    var err = el("p", { class: "err", style: "display:none" });
    var box = el("div", { style: "margin-top:10px" });

    function send(payload) {
      err.style.display = "none";
      api("/api/admin/schedule-change", Object.assign({ schedule_id: entry.id, date: date.value }, payload))
        .then(function (d) { box.remove(); paintChanges(d.changes); })
        ["catch"](function (e) { err.textContent = e.message; err.style.display = ""; });
    }

    box.append(
      el("div", { class: "row" },
        el("div", {}, el("label", {}, "Which date"), date),
        el("div", {}, el("label", {}, "New time"), at),
        el("div", {}, el("label", {}, "Somewhere else"), place)),
      el("div", { style: "margin-top:10px" }, el("label", {}, "A word to the club"), note),
      err,
      el("div", { class: "row", style: "margin-top:10px" },
        el("div", { style: "flex:0 0 auto" },
          el("button", { class: "btn primary", onclick: function () {
            send({ action: "set", at: at.value, place_en: place.value, note_en: note.value });
          } }, "Move it")),
        el("div", { style: "flex:0 0 auto" },
          el("button", { class: "btn", onclick: function () {
            if (!window.confirm("Call this one off? Athletes see it struck through with your note.")) return;
            send({ action: "set", cancelled: true, note_en: note.value });
          } }, "Call it off")),
        el("div", { style: "flex:0 0 auto" },
          el("button", { class: "btn", onclick: function () { box.remove(); } }, "Never mind"))));
    row.append(box);
  }

  function paintChanges(rows) {
    changes.textContent = "";
    changes.append(el("h3", { style: "font-family:var(--display);font-size:20px;text-transform:uppercase;margin:0 0 8px" },
      "Changed or called off"));
    if (!rows || !rows.length) {
      changes.append(el("p", { class: "muted small", style: "margin:0" },
        "Nothing changed in the next three weeks. The standing week runs as it is."));
      return;
    }
    rows.forEach(function (c) {
      changes.append(el("div", { class: "change-row" },
        el("span", { class: "when" }, c.date),
        el("span", { style: "flex:1 1 auto" }, (c.title_en || c.title_ar) +
          (c.cancelled ? " — called off" : c.at ? " — moved to " + c.at : " — changed") +
          (c.note_en ? " · " + c.note_en : "")),
        el("button", { class: "btn sm", onclick: function () {
          api("/api/admin/schedule-change", { action: "clear", schedule_id: c.schedule_id, date: c.date })
            .then(function (d) { paintChanges(d.changes); })
            ["catch"](function (e) { changes.append(el("p", { class: "err" }, e.message)); });
        } }, "Put it back")));
    });
  }

  function paint(d) {
    list.textContent = "";
    if (d && d.coaches) COACHES.tell(d.coaches);
    var all = (d && d.schedule) || [];
    if (!all.length) {
      list.append(el("p", { class: "wk-empty", style: "margin-top:14px" },
        "Nothing standing yet. Add the sessions the club runs every week and they appear in everyone's app."));
      return;
    }
    WK_DAYS.forEach(function (name, i) {
      var mine = all.filter(function (e) { return e.weekday === i; });
      if (!mine.length) return;
      var box = el("div", { class: "wk-day" }, el("h3", {}, name));
      mine.forEach(function (e) {
        var row = el("div", { class: "wk-row" + (e.active ? "" : " off") },
          el("span", { class: "at" }, e.at),
          el("div", { class: "what" },
            el("b", { dir: "auto" }, e.title_en || e.title_ar),
            el("span", { dir: "auto" }, (e.place_en || e.place_ar || "—") + " · " + e.points + " pts" +
              (COACHES.name(e.coach_id) ? " · " + COACHES.name(e.coach_id) : "") +
              (e.active ? "" : " · not on the schedule"))));
        /* A code for a session with no workout behind it. Seven of the ten
           weekly sessions are these, and without this nobody could check in
           to any of them. Opening one makes the session on the spot -- the
           same row Publish would have made, only with no steps. */
        var codeBtn = el("button", { class: "btn sm primary", onclick: function () {
          var was = codeBtn.textContent;
          codeBtn.disabled = true;
          codeBtn.textContent = "...";
          api("/api/admin/sessions", { action: "open", schedule_id: e.id, date: nextOccurrence(e.weekday) })
            .then(function (d) { qrScreen(d.session); })
            ["catch"](function (er) { row.append(el("p", { class: "err" }, er.message)); })
            .then(function () { codeBtn.disabled = false; codeBtn.textContent = was; });
        } }, "Show the code");

        row.append(el("div", { class: "acts" },
          e.active ? codeBtn : null,
          el("button", { class: "btn sm", onclick: function () { editing = e; form(); editor.scrollIntoView({ block: "nearest" }); } }, "Edit"),
          el("button", { class: "btn sm", onclick: function () { changeOne(e, row); } }, "Just this week"),
          el("button", { class: "btn sm", onclick: function () {
            if (!window.confirm("Remove " + (e.title_en || e.title_ar) + " on " + name + " from the standing week?")) return;
            post({ action: "delete", id: e.id }).then(paint)["catch"](function (er) { row.append(el("p", { class: "err" }, er.message)); });
          } }, "Remove")));
        box.append(row);
      });
      list.append(box);
    });
  }

  form();
  post({ action: "list" }).then(function (d) { paint(d); paintChanges(d.changes); })
    ["catch"](function (e) {
      list.append(el("p", { class: "muted small", style: "margin:14px 0 0" }, e.message));
    });
  return card;
}

function controls() {
  var refresh = el("button", { class: "btn", onclick: function () {
    refresh.disabled = true;
    load(password)["catch"](function (err) { renderLogin(err.message); });
  } }, "Refresh");

  return el("div", { class: "row", style: "margin-top:16px" },
    el("div", { style: "flex:0 0 auto" }, refresh),
    el("div", { style: "flex:0 0 auto" },
      el("button", { class: "btn", onclick: function () {
        // A password only ever lived in this tab, so forgetting it is enough.
        // A coach's login is a cookie the server holds, so that one is ended
        // properly rather than just hidden.
        var out = password ? Promise.resolve() : fetch("/api/auth/logout", {
          method: "POST", credentials: "same-origin"
        })["catch"](function () {});
        password = null;
        out.then(function () { renderLogin(null); });
      } }, "Lock")),
    el("div", { class: "muted small" },
      "Lock forgets the club password, or signs a coach out."));
}

renderLogin(null);
