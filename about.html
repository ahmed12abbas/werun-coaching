<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Are We · WE RUN</title>
<meta name="description" content="WE RUN is a Riyadh running community for every level — races, workshops, a women's performance group and ten sessions a week.">
<meta name="theme-color" content="#8851F4">
<!-- Same reason as privacy.html: Android auto-dark must not repaint the page; the dark theme is our own CSS. -->
<meta name="color-scheme" content="only light">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts.css?v=dfd2907d">
<script src="js/early-page.js?v=c24d8d05"></script>
<style>
/* Standalone like privacy.html: a page a partner can be sent to with no login.
   What is on it is js/about.js's document, edited from /admin. */
:root{
  --brand:#8851F4; --deep:#5B2FC9; --bg:#f7f7fa; --card:#fff; --fg:#14121c; --muted:#6a6580; --line:#e6e3ef;
  --tint:#efe8fe; --radius:18px; --display:"Teko",-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* Light until somebody picks dark with the switch -- not the phone's own
   setting: the club wants a first visit, a partner's included, to see the
   page as it was designed. */
:root[data-theme="dark"]{
  --brand:#A47CF8; --bg:#101019; --card:#191826; --fg:#eeecf5; --muted:#9d99b5; --line:#2a2840; --tint:#2a2145;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 60px}
/* A PC monitor gets the room: six numbers in a row, a taller banner. */
@media (min-width:1400px){.wrap{max-width:1240px;padding-top:28px}}
#page{min-height:70vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top a{color:var(--muted);text-decoration:none;font-size:14px}
.top .grow{flex:1}
.tool.icon{width:36px;height:36px;padding:0;display:grid;place-items:center}
.tool.icon svg{width:18px;height:18px}
.tool{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);color:var(--fg);cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;text-transform:uppercase;margin:0;line-height:1}
h2{font-size:40px;margin-bottom:14px}
h3{font-size:26px}
/* Teko has no Arabic glyphs. */
[dir="rtl"] h2,[dir="rtl"] h3{font-family:var(--body);font-weight:700;text-transform:none}
[dir="rtl"] h2{font-size:28px}
[dir="rtl"] h3{font-size:19px}
section{margin-top:52px}
p{margin:0 0 12px}
a{color:var(--brand)}
.muted{color:var(--muted)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
[dir="rtl"] .kicker{letter-spacing:0}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:clamp(380px,64vh,620px);
  display:flex;align-items:flex-end;color:#fff;background:var(--deep)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,10,45,0) 25%,rgba(20,10,45,.35) 50%,rgba(70,30,170,.92))}
.hero .in{position:relative;z-index:1;padding:28px clamp(20px,4vw,48px)}
.hero .kicker{color:#fff;opacity:.9}
.hero h1{font-size:clamp(84px,17vw,170px);line-height:.8;letter-spacing:.01em}
.hero p{font-size:clamp(17px,2.2vw,21px);max-width:34em;margin:12px 0 16px}
.badge{display:inline-flex;align-items:center;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* The team's mark in the banner, in white: the purple original would sink
   into the purple fade behind it. More specific than `.hero img`, which is
   the full-bleed photo. */
.hero h1.logo{line-height:0;margin:6px 0 4px}
.hero h1.logo img{position:static;inset:auto;width:clamp(150px,24vw,250px);height:auto;object-fit:contain;
  filter:brightness(0) invert(1) drop-shadow(0 6px 22px rgba(20,10,45,.45))}
/* The award, glowing. Still for anyone who asked for less motion. */
.hero .badge{border-color:rgba(255,255,255,.6);
  box-shadow:0 0 14px rgba(205,175,255,.6),0 0 36px rgba(160,110,255,.4),inset 0 0 10px rgba(255,255,255,.2)}
@media (prefers-reduced-motion:no-preference){.hero .badge{animation:badge-glow 2.6s ease-in-out infinite alternate}}
@keyframes badge-glow{
  from{box-shadow:0 0 10px rgba(205,175,255,.45),0 0 26px rgba(160,110,255,.25),inset 0 0 8px rgba(255,255,255,.14)}
  to{box-shadow:0 0 20px rgba(220,195,255,.85),0 0 48px rgba(160,110,255,.55),inset 0 0 14px rgba(255,255,255,.28)}}

/* The badge as a link: an arrow that says so, pointing the way the page reads. */
a.badge{color:#fff;text-decoration:none;cursor:pointer}
a.badge::after{content:"\2192";margin-inline-start:8px;font-weight:700}
[dir="rtl"] a.badge::after{content:"\2190"}
a.badge:hover,a.badge:focus-visible{background:rgba(255,255,255,.26)}
a.badge:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
#award{scroll-margin-top:24px}

/* ---- about ---- */
.about{display:grid;gap:28px;align-items:center}
.about .lead{font-size:clamp(19px,2.4vw,24px);line-height:1.5;font-weight:600}
.award{margin:0;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.award img{width:100%;aspect-ratio:3/2;object-fit:cover}
.award figcaption{padding:14px 18px;font-size:14px}
@media (min-width:820px){.about:not(.solo){grid-template-columns:1.1fr 1fr}}

/* ---- numbers ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 14px}
.num{font-family:var(--display);font-weight:600;font-size:58px;line-height:.85;color:var(--brand)}
.lbl{color:var(--muted);font-size:14px;margin-top:4px}
.band{margin-top:12px;background:var(--deep);color:#fff;border-radius:var(--radius);padding:24px clamp(20px,3vw,32px);
  display:grid;gap:22px}
.band .kicker{color:#fff;opacity:.8;margin:0}
.band .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
.band .num{color:#fff;font-size:clamp(44px,8vw,64px)}
.band .lbl{color:rgba(255,255,255,.8)}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.2);margin:8px 0 6px}
.split i:first-child{background:#fff}
.split i:last-child{background:#F48FC4}
.legend{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.legend b{font-family:var(--display);font-size:24px;font-weight:600;margin-inline-end:4px}
.facts{display:grid;gap:10px 22px;font-size:14px;color:rgba(255,255,255,.88)}
.facts:empty{display:none}
.plats{display:flex;flex-wrap:wrap;gap:8px}
.plat{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding-block:6px;padding-inline:7px 14px;
  background:rgba(255,255,255,.14);border-radius:999px;font-size:13px;color:#fff;text-decoration:none}
a.plat:hover,a.plat:focus-visible{background:rgba(255,255,255,.26)}
a.plat:focus-visible{outline:2px solid #fff;outline-offset:2px}
.plat .ic{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;flex:none}
.plat .ic svg{width:15px;height:15px}
.plat b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1;padding-top:2px}
@media (prefers-reduced-motion:no-preference){a.plat{transition:background .2s}}
/* Wide, the numbers and the men/women split sit side by side and the account
   chips run underneath both; placed in source order they would push the split
   onto a row of its own and leave half the band empty. */
@media (min-width:760px){.plats{grid-column:1/-1;order:1}.facts{order:2}}
@media (min-width:760px){.band{grid-template-columns:1.2fr 1fr}.band .kicker{grid-column:1/-1}.facts{grid-column:1/-1;grid-template-columns:1fr 1fr}}

/* ---- goals ---- */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.goal .n{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px;
  background:var(--tint);color:var(--brand);font-family:var(--display);font-size:26px;font-weight:600;line-height:1;padding-top:4px}
.goal h3{margin-bottom:6px}
.goal p{color:var(--muted);font-size:15px;margin:0}

/* ---- the gallery ---- */
.gallery{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;grid-auto-flow:dense;gap:10px}
.gallery figure{position:relative;margin:0;border-radius:14px;overflow:hidden;background:var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery .wide{grid-column:1/-1;grid-row:span 2}
.gallery .tall{grid-row:span 2}
.gallery figcaption{position:absolute;inset-inline:0;bottom:0;padding:28px 12px 10px;color:#fff;font-size:13px;font-weight:600;
  line-height:1.3;background:linear-gradient(transparent,rgba(10,5,25,.78))}
@media (min-width:760px){
  .gallery{grid-template-columns:repeat(3,1fr);grid-auto-rows:210px}
  .gallery .wide{grid-column:span 2}
  .gallery figcaption{font-size:14px;padding:36px 16px 12px}
}
@media (min-width:1400px){.gallery{grid-auto-rows:250px}}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .gallery img{transition:transform .6s ease}
  .gallery figure:hover img{transform:scale(1.05)}
}

/* ---- weekly sessions ----
   Small tiles, two across on a phone; a tap opens the rest in a dialog. */
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
@media (min-width:1000px){.sessions{grid-template-columns:repeat(5,1fr)}}
.sess{font:inherit;color:inherit;text-align:start;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.sess:hover,.sess:focus-visible{border-color:var(--brand)}
.sess:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sess .day,.sess-dlg .day{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
[dir="rtl"] .sess .day,[dir="rtl"] .sess-dlg .day{letter-spacing:0}
.sess .time{font-family:var(--display);font-size:26px;font-weight:600;line-height:1;margin-top:2px}
.sess .what{font-size:13px;font-weight:600;color:var(--muted);line-height:1.3}
.sess-dlg{border:0;padding:0;border-radius:22px;background:var(--card);color:var(--fg);
  width:min(420px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(20,10,45,.35)}
.sess-dlg::backdrop{background:rgba(16,10,35,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sess-dlg .in{position:relative;padding:24px 22px 22px}
.sess-dlg .x{position:absolute;inset-inline-end:12px;top:12px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.sess-dlg .time{font-family:var(--display);font-size:46px;font-weight:600;line-height:1;margin:6px 0 8px}
.sess-dlg h3{font-size:26px;margin-bottom:6px;padding-inline-end:44px}
.sess-dlg .place{color:var(--muted);margin-bottom:18px}
.sess-dlg .btn.map{background:var(--brand);color:#fff}
@media (prefers-reduced-motion:no-preference){.sess-dlg[open]{animation:dlg-in .22s cubic-bezier(.2,.7,.2,1)}}
@keyframes dlg-in{from{opacity:0;transform:translateY(12px) scale(.97)}}

/* ---- coming up ---- */
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.event{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.date{flex:none;width:76px;text-align:center;background:var(--deep);color:#fff;border-radius:14px;padding:10px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase}
.date b{display:block;font-family:var(--display);font-size:44px;line-height:.8;font-weight:600;padding-top:4px}
.event.pink .date{background:#D6428E}
.evlogo{flex:none;width:92px;height:92px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.evlogo img{display:block;width:100%;height:100%;object-fit:cover}
.when{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--deep);margin-bottom:2px}
.event.pink .when{color:#D6428E}
.event:has(img[src*="event-j25k"]) .when{color:#00A9E0}
a.event{color:inherit;text-decoration:none}
a.event:hover{border-color:var(--brand,#5B2EC9)}
.event.glow{border-color:#5B2EC9;animation:evglow 2s ease-in-out infinite}
@keyframes evglow{0%,100%{box-shadow:0 0 6px rgba(91,46,201,.35)}50%{box-shadow:0 0 22px 4px rgba(91,46,201,.7)}}
@media (prefers-reduced-motion:reduce){.event.glow{animation:none;box-shadow:0 0 16px 2px rgba(91,46,201,.55)}}
.event h3{margin-bottom:4px}
.event p{margin:0;font-size:14px;color:var(--muted)}

/* ---- a text block added from /admin ---- */
.textsec p{max-width:48em}
.textsec img{width:100%;max-height:520px;object-fit:cover;border-radius:var(--radius);margin-top:16px}

/* ---- call to action ---- */
.cta{position:relative;overflow:hidden;border-radius:26px;color:#fff;text-align:center;padding:56px 22px;background:var(--deep)}
.cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta::after{content:"";position:absolute;inset:0;background:rgba(60,25,150,.82)}
.cta .in{position:relative;z-index:1;max-width:600px;margin:0 auto}
.cta h2{font-size:clamp(48px,9vw,80px);margin-bottom:8px}
.cta p{font-size:17px;opacity:.92;margin-bottom:22px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-weight:700;text-decoration:none;font-size:15px}
.btn.primary{background:#fff;color:var(--deep)}
/* The one button the page is for, glowing like the award badge above it.
   Still for anyone who asked for less motion; Arabic is never letter-spaced. */
.cta .btn.primary{letter-spacing:.06em;box-shadow:0 0 16px rgba(255,255,255,.55),0 0 38px rgba(200,170,255,.5)}
[dir="rtl"] .cta .btn.primary{letter-spacing:0}
@media (prefers-reduced-motion:no-preference){.cta .btn.primary{animation:join-glow 2.4s ease-in-out infinite alternate}}
@keyframes join-glow{
  from{box-shadow:0 0 10px rgba(255,255,255,.4),0 0 24px rgba(200,170,255,.3)}
  to{box-shadow:0 0 22px rgba(255,255,255,.85),0 0 54px rgba(200,170,255,.7)}}
.btn.ghost{border:1.5px solid rgba(255,255,255,.75);color:#fff}
.btn:focus-visible,.tool:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
/* ---- partner logos ----
   The logos were cut from the deck on its own purple, so the band is that
   exact colour in both themes and their edges disappear into it. */
.partners{background:#8a52f7;color:#fff;border-radius:26px;padding:30px clamp(18px,3vw,40px)}
.partners h2{color:#fff;margin-bottom:6px}
.partners p{opacity:.92;margin-bottom:18px}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.logos div{height:108px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:10px}
.logos img{max-width:100%;max-height:84px;object-fit:contain}
@media (min-width:1000px){.logos{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.logos div{height:128px}.logos img{max-height:100px}}

/* ---- rising into view ----
   Only with .reveal on the root, which the script sets when the browser can
   say what is on screen and the reader has not asked for less motion; without
   it the page is simply there. Cards follow their section in, a beat apart
   (the delays are set by the script). */
.reveal #page > *{opacity:0;transform:translateY(28px);
  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal #page > .in{opacity:1;transform:none}
.reveal #page > * :is(.stat,.goal,.sess,.gallery figure,.logos > div,.event){opacity:0;transform:translateY(16px) scale(.98);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal #page > .in :is(.stat,.goal,.sess,.gallery figure,.logos > div,.event){opacity:1;transform:none}
/* Paper has no scrolling: a partner printing the page gets all of it. */
@media print{.reveal #page > *,.reveal #page > * *{opacity:1 !important;transform:none !important}}

footer{margin-top:40px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit}
/* The same five as the app's footer, from the same list (SOCIAL in js/brand.js). */
.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.socials a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--brand)}
.socials a:hover,.socials a:focus-visible{background:var(--brand);color:#fff}
.socials svg{width:20px;height:20px}

/* ---- back to the top ---- */
.totop{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;
  width:50px;height:50px;border-radius:50%;border:0;background:var(--brand);color:#fff;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(60,25,150,.35);
  opacity:0;pointer-events:none;transform:translateY(10px)}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop svg{width:22px;height:22px}
.totop:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.totop{transition:opacity .25s ease,transform .25s ease}
  .socials a{transition:background .2s,color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="grow" href="/app.html" id="back">← WE RUN</a>
    <button class="tool icon" type="button" id="theme" data-sfx="flip"></button>
    <button class="tool" type="button" id="lang">العربية</button>
  </div>
  <main id="page"></main>
  <footer>
    <nav class="socials" id="socials" aria-label="WE RUN on social"></nav>
    WE RUN Coaching · <a href="/privacy" id="privacy">Privacy</a>
  </footer>
</div>
<button class="totop" id="totop" type="button" aria-label="Back to top" title="Back to top" tabindex="-1" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="js/brand.js?v=8065255a"></script>
<script src="js/sfx.js?v=7b9bd8c9"></script>
<script src="js/about.js?v=8b77e5f7"></script>
<script src="js/about-page.js?v=7c577d53"></script>
</body>
</html>
