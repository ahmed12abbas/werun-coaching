<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WE RUN Club</title>
<meta name="description" content="The WE RUN club: this week's sessions, check in at the track, your points.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8851F4">
<!-- "only light" forbids Android auto-dark from repainting the page: it greyed out the check-in code on Sami's phone (14 Sep). The dark theme is our own CSS. -->
<meta name="color-scheme" content="only light">
<link rel="icon" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "default", not "black-translucent": installed on an iPhone, the see-through
     status bar made iOS lay the app out a status bar's height short of the
     bottom of the screen and paint that strip itself, under the tabs (21 Oct). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WE RUN">
<!-- The saved theme, before anything paints: i18n.js sets it too, but only
     at the bottom of the page, after the splash has drawn in light. -->
<script src="js/early.js?v=af0c0ac7"></script>
<!-- Saudi National Day, one week only: Sat 19 Sep – Thu 24 Sep 2026, Riyadh
     time (UTC+3, no DST). App page only — see assets/app.css for the theme
     and .splash-nd below for the swapped intro. ?nd=1 on localhost previews
     it early; it does nothing anywhere else. -->
<script src="js/app-early.js?v=36b46414"></script>

<link rel="stylesheet" href="assets/fonts.css?v=dfd2907d">
<link rel="stylesheet" href="assets/site.css?v=0ecf332d">
<link rel="stylesheet" href="assets/app.css?v=ae30d991">
</head>
<body>
<div class="splash" aria-hidden="true">
<div class="splash-row">
<img class="splash-default" src="assets/logo.png" alt="">
<img class="splash-swoosh splash-swoosh-light" src="assets/swoosh-black.webp" alt="">
<img class="splash-swoosh splash-swoosh-dark" src="assets/swoosh-white.webp" alt="">
</div>
<img class="splash-nd" src="assets/nationalday-emblem.webp" alt="">
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<!-- The same scripts as the link page, in the same order, then the app's own.
     Everything shares one global scope; app.js is the entry point. -->
