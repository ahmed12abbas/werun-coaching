<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WE RUN Club</title>
<meta name="description" content="The WE RUN club: this week's sessions, check in at the track, your points.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8851F4">
<!-- "only light" forbids Android auto-dark from repainting the page: it greyed out the check-in code on Sami's phone (14 Sep). The dark theme is our own CSS. -->
<meta name="color-scheme" content="only light">
<link rel="icon" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WE RUN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The saved theme, before anything paints: i18n.js sets it too, but only
     at the bottom of the page, after the splash has drawn in light. -->
<script>try{var t=localStorage.getItem("werun.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<!-- Saudi National Day, one week only: Sat 19 Sep – Thu 24 Sep 2026, Riyadh
     time (UTC+3, no DST). App page only — see assets/app.css for the theme
     and .splash-nd below for the swapped intro. ?nd=1 on localhost previews
     it early; it does nothing anywhere else. -->
<script>try{
  var ndStart=Date.UTC(2026,8,18,21,0,0), ndEnd=Date.UTC(2026,8,24,21,0,0), now=Date.now();
  var ndPreview=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/(^|[?&])nd=1(&|$)/.test(location.search);
  if(ndPreview||(now>=ndStart&&now<ndEnd))document.documentElement.setAttribute("data-event","nationalday")
}catch(e){}</script>
<script>window.ME_EARLY=fetch("/api/auth/me",{credentials:"same-origin",headers:{accept:"application/json"}}).catch(function(){return null})</script>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/site.css?v=aa803476">
<link rel="stylesheet" href="assets/app.css?v=0f18f49f">
